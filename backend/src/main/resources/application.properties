# ── HTTP ─────────────────────────────────────────────────────
# Mesma porta do antigo server.py (o frontend usa http://localhost:5000 por padrão).
# Plataformas como Render/Railway/Heroku informam a porta pela variável PORT.
quarkus.http.port=${PORT:5000}
quarkus.http.test-port=0

# CORS liberado para qualquer origem, como o Flask-CORS fazia.
# Em produção, restrinja com MENCTOR_CORS_ORIGINS (ex.: https://menctor.vercel.app).
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${MENCTOR_CORS_ORIGINS:/.*/}
quarkus.http.cors.access-control-allow-credentials=false
quarkus.http.cors.exposed-headers=Content-Disposition

# ── Frontend estático ────────────────────────────────────────
# Pasta com o index.html do frontend. Vazio: procura no diretório atual e no pai.
# menctor.frontend.dir=/caminho/para/o/frontend
%test.menctor.frontend.dir=src/test/resources/frontend-teste

# ── Banco de dados (PostgreSQL) ──────────────────────────────
# Desenvolvimento: `docker compose up -d db` na raiz do repositório.
# Produção: DB_URL, DB_USER e DB_PASSWORD apontando para o PostgreSQL do ambiente.
# Nos testes o Quarkus sobe um PostgreSQL descartável sozinho (Dev Services).
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/menctor}
%dev.quarkus.datasource.username=${DB_USER:menctor}
%dev.quarkus.datasource.password=${DB_PASSWORD:menctor}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/menctor}
%prod.quarkus.datasource.username=${DB_USER:menctor}
%prod.quarkus.datasource.password=${DB_PASSWORD:menctor}
quarkus.datasource.devservices.image-name=postgres:17-alpine
# As migrações em src/main/resources/db/migration criam e atualizam o esquema ao iniciar.
quarkus.flyway.migrate-at-start=true

# ── E-mail (SMTP) ────────────────────────────────────────────
# Mesmas variáveis MAIL_* do .env usado pelo server.py.
menctor.mail.host=${MAIL_HOST:}
menctor.mail.username=${MAIL_USERNAME:}
menctor.mail.password=${MAIL_PASSWORD:}
menctor.mail.from-name=${MAIL_FROM_NAME:Menctor}

quarkus.mailer.host=${MAIL_HOST:localhost}
quarkus.mailer.port=${MAIL_PORT:587}
quarkus.mailer.username=${MAIL_USERNAME:}
quarkus.mailer.password=${MAIL_PASSWORD:}
# Como o smtplib do server.py: STARTTLS e login obrigatórios, timeout de 20 s.
quarkus.mailer.tls=false
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.login=REQUIRED
quarkus.mailer.timeout=20S
# O dev mode envia e-mails de verdade (como o server.py); os testes usam a caixa em memória.
%dev.quarkus.mailer.mock=false
%test.quarkus.mailer.mock=true
%test.menctor.mail.host=smtp.teste.local
%test.menctor.mail.username=menctor@teste.local
%test.menctor.mail.password=senha-de-teste
%test.menctor.mail.from-name=Menctor Testes

# ── Logs ─────────────────────────────────────────────────────
# O PDFBox avisa sobre fontes do sistema que não consegue ler; não afeta a geração.
quarkus.log.category."org.apache.pdfbox".level=ERROR
quarkus.log.category."org.apache.fontbox".level=ERROR
